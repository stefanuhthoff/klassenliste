<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <title>Klassenliste GO</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#A11135">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Klassenliste">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <style>
    :root { --rot: #A11135; --blau: #0D557D; --text: #1E2A30; --grau: #6B767C; }
    html, body { margin: 0; height: 100%; background: var(--rot); overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; }
    /* Rot hinter der Statusleiste, darunter die eigentliche Seite */
    #frame { position: fixed; left: 0; right: 0; bottom: 0; top: env(safe-area-inset-top, 0px);
      width: 100%; height: calc(100% - env(safe-area-inset-top, 0px)); border: 0; background: #fff; display: block; }
    #splash { position: fixed; inset: 0; background: var(--rot); color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 18px; z-index: 5; transition: opacity .35s; }
    #splash.hide { opacity: 0; pointer-events: none; }
    #splash .go { width: 92px; height: 92px; border-radius: 50%; border: 3px solid #fff; display: grid; place-items: center;
      font: 700 34px/1 Georgia, serif; letter-spacing: 1px; }
    #splash img { max-width: 190px; max-height: 90px; }
    #splash p { margin: 0; font-size: 15px; opacity: .9; }
    .spin { width: 22px; height: 22px; border: 3px solid rgba(255,255,255,.35); border-top-color: #fff; border-radius: 50%;
      animation: r 0.9s linear infinite; }
    @keyframes r { to { transform: rotate(360deg); } }
    #splash .note { max-width: 320px; text-align: center; font-size: 14px; line-height: 1.45; padding: 0 20px; }
    #splash button, .sheet button { font: inherit; border: 0; border-radius: 10px; padding: 12px 18px; cursor: pointer; }
    #splash button { background: #fff; color: var(--rot); font-weight: 600; }

    /* Datei-Fenster (PDF, CSV, Kontakte) */
    #sheetBg { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 10; display: none; }
    .sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 11; background: #fff; color: var(--text);
      border-radius: 16px 16px 0 0; padding: 20px 18px calc(18px + env(safe-area-inset-bottom, 0px));
      box-shadow: 0 -6px 24px rgba(0,0,0,.18); transform: translateY(110%); transition: transform .25s; max-width: 560px; margin: 0 auto; }
    .sheet.open { transform: none; }
    .sheet h2 { margin: 0 0 4px; font-size: 17px; }
    .sheet .fname { margin: 0 0 16px; color: var(--grau); font-size: 13px; word-break: break-all; }
    .sheet .btns { display: grid; gap: 10px; }
    .sheet .primary { background: var(--rot); color: #fff; font-weight: 600; }
    .sheet .second { background: #EEF3F6; color: var(--blau); font-weight: 600; }
    .sheet .cancel { background: transparent; color: var(--grau); }
    .sheet .hint { margin: 12px 2px 0; font-size: 12.5px; color: var(--grau); line-height: 1.4; }

    /* Hinweis „Als App installieren“ (nur im normalen Browser) */
    #install { position: fixed; left: 10px; right: 10px; bottom: calc(10px + env(safe-area-inset-bottom, 0px)); z-index: 8;
      background: var(--blau); color: #fff; border-radius: 12px; padding: 12px 44px 12px 14px; font-size: 14px; line-height: 1.4;
      box-shadow: 0 6px 20px rgba(0,0,0,.25); display: none; max-width: 520px; margin: 0 auto; }
    #install b { display: block; margin-bottom: 2px; }
    #install .x { position: absolute; top: 6px; right: 6px; width: 32px; height: 32px; border: 0; border-radius: 50%;
      background: rgba(255,255,255,.18); color: #fff; font-size: 18px; line-height: 1; cursor: pointer; }
    #install .do { margin-top: 8px; background: #fff; color: var(--blau); border: 0; border-radius: 8px; padding: 8px 14px;
      font: inherit; font-weight: 600; cursor: pointer; }
  </style>
</head>
<body>
  <div id="splash">
    <img id="logo" alt="Gymnasium Othmarschen"
         src="https://image.jimcdn.com/app/cms/image/transf/dimension=400x10000:format=png/path/s8c519e0e21b32b69/image/i7c02cec0967b0c0c/version/1789934192/image.png"
         onerror="this.remove();document.getElementById('goFallback').style.display='grid';">
    <div class="go" id="goFallback" style="display:none">GO</div>
    <div class="spin" id="spin"></div>
    <p id="splashText">Klassenliste wird geladen …</p>
  </div>

  <iframe id="frame" title="Klassenliste" allow="clipboard-write; web-share"></iframe>

  <div id="sheetBg"></div>
  <div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
    <h2 id="sheetTitle">Datei ist bereit</h2>
    <p class="fname" id="sheetName"></p>
    <div class="btns" id="sheetBtns"></div>
    <p class="hint" id="sheetHint"></p>
  </div>

  <div id="install" role="note">
    <button class="x" type="button" aria-label="Hinweis schließen">×</button>
    <b>Als App nutzen</b>
    <span id="installText"></span>
  </div>

<script>
(function () {
  'use strict';

  /* =============================================================
     EINSTELLUNG: Adresse der Google-Web-App (endet auf /exec).
     Bereitstellen → Bereitstellungen verwalten → Web-App-URL kopieren.
     ============================================================= */
  var APP_URL = 'https://script.google.com/macros/s/AKfycbx5z5FNns1hFn3-Erazgx9pyhhjE69iPHD82mbMqJa36cjobGb2Mozru_Lv5CWrPFiF/exec';

  var RT_KEY = 'go_klassenliste_rt';
  var $ = function (id) { return document.getElementById(id); };
  var frame = $('frame'), splash = $('splash');
  var standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);

  function store(k, v) { try { if (v == null) localStorage.removeItem(k); else localStorage.setItem(k, v); } catch (e) {} }
  function read(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }

  function hideSplash() { splash.classList.add('hide'); }
  function splashMsg(html, retry) {
    $('spin').style.display = 'none';
    $('splashText').innerHTML = '';
    var n = document.createElement('div'); n.className = 'note'; n.innerHTML = html; $('splashText').appendChild(n);
    if (retry) {
      var b = document.createElement('button'); b.textContent = 'Erneut versuchen';
      b.style.marginTop = '14px'; b.onclick = function () { location.reload(); };
      n.appendChild(document.createElement('br')); n.appendChild(b);
    }
  }

  /* ---------- Start ---------- */
  if (/HIER_DIE_ID/.test(APP_URL)) {
    splashMsg('Die App ist noch nicht eingerichtet.<br>In <b>index.html</b> oben die Adresse der Google-Web-App bei <b>APP_URL</b> eintragen.');
    return;
  }
  if (!navigator.onLine) {
    splashMsg('Keine Internetverbindung.<br>Die Klassenliste braucht eine Verbindung, um die aktuellen Daten zu laden.', true);
    window.addEventListener('online', function () { location.reload(); });
    return;
  }
  frame.src = APP_URL;
  frame.addEventListener('load', function () { setTimeout(hideSplash, 400); });
  setTimeout(hideSplash, 12000);   // spätestens dann die Seite zeigen (auch ohne Rückmeldung)

  /* ---------- Verbindung zur Klassenliste ----------
     Nur Nachrichten aus der Google-Apps-Script-Umgebung werden angenommen. */
  function trusted(ev) { return /^https:\/\/[a-z0-9-]+-script\.googleusercontent\.com$/i.test(ev.origin); }
  window.addEventListener('message', function (ev) {
    if (!trusted(ev) || !ev.data || typeof ev.data !== 'object') return;
    var d = ev.data;
    switch (d.go) {
      case 'hello':
        ev.source.postMessage({ go: 'host', rt: read(RT_KEY), standalone: standalone }, ev.origin);
        break;
      case 'ready':
        hideSplash();
        break;
      case 'saveRt':
        if (typeof d.rt === 'string' && d.rt.length >= 40 && d.rt.length < 200) store(RT_KEY, d.rt);
        break;
      case 'forgetRt':
        store(RT_KEY, null);
        break;
      case 'file':
        if (d.blob instanceof Blob) showFile(d.blob, String(d.name || 'datei'), String(d.mime || d.blob.type || ''));
        break;
    }
  });

  /* ---------- Dateien (PDF, CSV, Kontakte) teilen / sichern ---------- */
  var openUrl = null;
  function closeSheet() {
    $('sheet').classList.remove('open'); $('sheetBg').style.display = 'none';
    if (openUrl) { var u = openUrl; openUrl = null; setTimeout(function () { URL.revokeObjectURL(u); }, 60000); }
  }
  $('sheetBg').addEventListener('click', closeSheet);

  function showFile(blob, name, mime) {
    var file = null;
    try { file = new File([blob], name, { type: mime }); } catch (e) {}
    var canShare = !!(file && navigator.canShare && navigator.canShare({ files: [file] }));
    var isVcf = /vcard/i.test(mime) || /\.vcf$/i.test(name);
    var isPdf = /pdf/i.test(mime);
    openUrl = URL.createObjectURL(blob);

    $('sheetTitle').textContent = isVcf ? 'Kontakt ist bereit' : isPdf ? 'PDF ist bereit' : 'Datei ist bereit';
    $('sheetName').textContent = name;
    var btns = $('sheetBtns'); btns.innerHTML = '';
    function add(label, cls, fn) {
      var b = document.createElement('button'); b.type = 'button'; b.className = cls; b.textContent = label;
      b.onclick = fn; btns.appendChild(b);
    }
    var hint = '';
    if (canShare) {
      add(isVcf ? 'Teilen … (z. B. „Kontakte“)' : 'Teilen / Sichern …', 'primary', function () {
        navigator.share({ files: [file], title: name }).then(closeSheet).catch(function () {});
      });
    }
    if (!isIOS) {
      add('Herunterladen', canShare ? 'second' : 'primary', function () {
        var a = document.createElement('a'); a.href = openUrl; a.download = name;
        document.body.appendChild(a); a.click(); a.remove(); closeSheet();
      });
    }
    add('Öffnen', 'second', function () {
      window.open(openUrl, '_blank');
    });
    add('Schließen', 'cancel', closeSheet);
    if (isIOS && isPdf) hint = '„Teilen“ → „In Dateien sichern“, „Drucken“ oder per Mail/Messenger senden.';
    if (isIOS && isVcf) hint = 'Falls „Kontakte“ beim Teilen nicht erscheint: „Öffnen“ wählen → „Neuen Kontakt erstellen“.';
    $('sheetHint').textContent = hint;
    $('sheetBg').style.display = 'block';
    requestAnimationFrame(function () { $('sheet').classList.add('open'); });
  }

  /* ---------- Hinweis „Zum Home-Bildschirm“ (nur im normalen Browser) ---------- */
  var deferred = null;
  function showInstall(html, withButton) {
    if (standalone || read('go_install_hidden') === '1') return;
    $('installText').innerHTML = html;
    if (withButton) {
      var b = document.createElement('button'); b.className = 'do'; b.type = 'button'; b.textContent = 'App installieren';
      b.onclick = function () {
        deferred.prompt();
        deferred.userChoice.then(function () { $('install').style.display = 'none'; deferred = null; });
      };
      $('installText').appendChild(document.createElement('br')); $('installText').appendChild(b);
    }
    $('install').style.display = 'block';
  }
  $('install').querySelector('.x').addEventListener('click', function () {
    $('install').style.display = 'none'; store('go_install_hidden', '1');
  });
  window.addEventListener('beforeinstallprompt', function (e) {
    e.preventDefault(); deferred = e;
    showInstall('Mit eigenem Symbol auf dem Startbildschirm – öffnet sich wie eine App.', true);
  });
  setTimeout(function () {
    if (deferred || standalone) return;
    if (isIOS) showInstall('In Safari unten auf <b>Teilen</b> <span aria-hidden="true">⬆︎</span> tippen → <b>„Zum Home-Bildschirm“</b>.');
    else if (/Android/i.test(navigator.userAgent)) showInstall('In Chrome oben rechts auf <b>⋮</b> tippen → <b>„Zum Startbildschirm hinzufügen“</b> bzw. <b>„App installieren“</b>.');
  }, 2500);

  /* ---------- Service Worker (macht die Seite installierbar) ---------- */
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () { navigator.serviceWorker.register('sw.js').catch(function () {}); });
  }
})();
</script>
</body>
</html>
